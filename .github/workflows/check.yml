name: Repository check

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Run standalone acceptance
        shell: bash
        env:
          SANGREP_CI_EVENT_NAME: ${{ github.event_name }}
          SANGREP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SANGREP_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          started=$SECONDS
          ./scripts/check
          elapsed=$((SECONDS - started))
          printf 'elapsed_seconds=%s\n' "$elapsed"
