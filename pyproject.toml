[project]
name = "sangrep-contracts"
version = "0.1.0.dev0"
description = "Versioned evidence and review-harness wire contracts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "cryptography>=50,<51",
  "jsonschema>=4.23,<5",
  "mypy>=1.13",
  "pip-audit>=2.10,<3",
  "pytest>=8",
  "ruff>=0.8,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sangrep_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "sangrep_contracts/schemas"
"trust" = "sangrep_contracts/trust"
"vectors" = "sangrep_contracts/vectors"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-q"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
